[package]
name = "readest-supervisor"
version = "0.12.16"
edition = "2021"
description = "Process supervisor + dashboard for the self-hosted Readest server bundle: spawns sync-server and the web reader, restarts them with backoff, and keeps them alive only as long as itself"
license = "AGPL-3.0"

# Standalone crate like sync-server itself: must NOT join the repo-root Tauri
# Cargo workspace, and must not become a member of sync-server's workspace.
[workspace]

[dependencies]
anyhow = "1"
crossterm = "0.28"
dotenvy = "0.15"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "io-util", "process", "net", "time", "sync"] }

# Tray is Windows-only (⑩ P4 finding): tray-icon's Linux backend is the GTK
# stack (muda → glib/gdk/pango system deps) — a headless server build must
# not require it. Linux control surfaces: systemctl, attach TUI, admin page.
[target.'cfg(windows)'.dependencies]
png = "0.17"
tray-icon = "0.21"
windows-sys = { version = "0.59", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
