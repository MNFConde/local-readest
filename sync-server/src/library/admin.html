<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Readest sync-server 管理页</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px auto; max-width: 960px; color: #1a1a1a; }
  h1 { font-size: 20px; } h2 { font-size: 16px; margin-top: 28px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #ddd; padding: 4px 8px; text-align: left; }
  th { background: #f5f5f5; }
  input, button { font-size: 13px; padding: 4px 8px; }
  input { width: 240px; }
  td input { width: 100%; box-sizing: border-box; }
  button { cursor: pointer; }
  .row { margin: 8px 0; }
  .muted { color: #777; }
  .ok { color: #0a7d32; } .err { color: #c02c2c; }
  #msg { margin: 8px 0; min-height: 18px; }
</style>
</head>
<body>
<h1>Readest sync-server 管理页</h1>
<div class="row">
  <label>ADMIN_TOKEN <input id="token" type="password" placeholder="未设置则管理接口整体禁用"></label>
  <button onclick="saveToken()">保存到本机</button>
  <button onclick="loadAll()">加载</button>
  <span class="muted">服务端未配置 ADMIN_TOKEN 时，/api/admin 一律 404。</span>
</div>
<div id="msg"></div>

<h2>书目（catalog_books）</h2>
<table id="books"><thead><tr>
  <th>hash</th><th>标题</th><th>作者</th><th>语言</th><th>作品 work_id</th><th>原文 source_hash</th><th>上传者</th><th></th>
</tr></thead><tbody></tbody></table>
<div class="row">
  <button onclick="enrich()">用 Open Library 自动归组未分组书目</button>
  <button onclick="gc()">清理孤儿 blob</button>
  <span class="muted">AI 译本等 OL 查不到的书：手工填 work_id（可与其它书相同）或留空 + source_hash 指向原文 hash。</span>
</div>

<h2>作品（works）</h2>
<table id="works"><thead><tr><th>id</th><th>标题</th><th>作者</th><th>书目数</th></tr></thead><tbody></tbody></table>
<div class="row">
  <input id="w-title" placeholder="作品标题"><input id="w-author" placeholder="作者">
  <button onclick="createWork()">新建作品</button>
</div>

<h2>用户</h2>
<table id="users"><thead><tr><th>邮箱</th><th>id</th><th>状态</th><th>创建时间</th><th></th></tr></thead><tbody></tbody></table>
<div class="muted">建用户 / 重置登录码请用 CLI：sync-server add-user / passwd。</div>

<script>
const $ = (id) => document.getElementById(id);
const token = () => localStorage.getItem('admin_token') || $('token').value;
function saveToken() { localStorage.setItem('admin_token', $('token').value); msg('已保存到本机 localStorage', 'ok'); }
function msg(text, cls) { const el = $('msg'); el.textContent = text; el.className = cls || ''; }
async function api(path, opts = {}) {
  const res = await fetch('/api/admin' + path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + token(), 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  if (res.status === 404) throw new Error('404：服务端未设置 ADMIN_TOKEN');
  if (res.status === 401) throw new Error('401：token 不对');
  if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
  return res.json();
}
function esc(s) { return (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

async function loadBooks() {
  const data = await api('/books');
  const tb = $('books').tBodies[0];
  tb.innerHTML = '';
  for (const b of data.books) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="muted">${esc(b.hash).slice(0,12)}…</td>
      <td><input id="t-${b.hash}" value="${esc(b.title)}"></td>
      <td><input id="a-${b.hash}" value="${esc(b.author)}"></td>
      <td><input id="l-${b.hash}" value="${esc(b.language)}" size="4"></td>
      <td><input id="w-${b.hash}" value="${esc(b.workId || '')}" placeholder="留空=不归组" size="12"></td>
      <td><input id="s-${b.hash}" value="${esc(b.sourceHash || '')}" size="12"></td>
      <td class="muted">${esc(b.addedBy).slice(0,8)}…</td>
      <td><button onclick="saveBook('${b.hash}')">保存</button></td>`;
    tb.appendChild(tr);
  }
}
async function saveBook(hash) {
  const v = (id) => { const el = $(id + '-' + hash); return el ? el.value : undefined; };
  const workId = v('w');
  await api('/books/' + hash, { method: 'POST', body: JSON.stringify({
    title: v('t'), author: v('a'), language: v('l'),
    workId: workId === '' ? null : workId,
    sourceHash: v('s'),
  })});
  msg('已保存 ' + hash.slice(0, 10) + '…', 'ok');
  await loadBooks();
}
async function loadWorks() {
  const data = await api('/works');
  $('works').tBodies[0].innerHTML = data.works.map(w =>
    `<tr><td>${esc(w.id)}</td><td>${esc(w.title)}</td><td>${esc(w.author)}</td><td>${w.books}</td></tr>`).join('');
}
async function createWork() {
  const r = await api('/works', { method: 'POST', body: JSON.stringify({ title: $('w-title').value, author: $('w-author').value }) });
  msg('已创建作品 ' + r.id + '，把书目表格里的 work_id 填成它再保存', 'ok');
  await loadWorks();
}
async function loadUsers() {
  const data = await api('/users');
  $('users').tBodies[0].innerHTML = data.users.map(u =>
    `<tr><td>${esc(u.email)}</td><td class="muted">${esc(u.id)}</td>
     <td>${u.disabled ? '<span class="err">停用</span>' : '<span class="ok">正常</span>'}</td>
     <td class="muted">${esc(u.createdAt)}</td>
     <td><button onclick="toggleUser('${esc(u.email)}', ${!u.disabled})">${u.disabled ? '启用' : '停用'}</button></td></tr>`).join('');
}
async function toggleUser(email, disabled) {
  await api('/users/' + encodeURIComponent(email) + '/state', { method: 'POST', body: JSON.stringify({ disabled }) });
  msg('已' + (disabled ? '停用' : '启用') + ' ' + email, 'ok');
  await loadUsers();
}
async function enrich() {
  msg('正在查询 Open Library……');
  const r = await api('/enrich', { method: 'POST' });
  msg(`自动归组完成：成功 ${r.enriched}，未匹配/失败 ${r.failed.length}`, r.failed.length ? 'err' : 'ok');
  await loadBooks(); await loadWorks();
}
async function gc() {
  const r = await api('/gc', { method: 'POST' });
  msg(`已清理 ${r.removed} 个孤儿 blob`, 'ok');
}
async function loadAll() {
  try {
    await Promise.all([loadBooks(), loadWorks(), loadUsers()]);
    msg('已加载', 'ok');
  } catch (e) { msg(e.message, 'err'); }
}
$('token').value = localStorage.getItem('admin_token') || '';
</script>
</body>
</html>
