name: Docker sync-server

# Multi-arch (amd64+arm64) image for the self-hosted sync server, pushed to
# ghcr.io. Each arch builds natively on its own runner (no QEMU — a Rust
# build under emulation takes the better part of an hour), then the digests
# are merged into one manifest. Standard pattern from docker docs.
#
# Tags: v* tag → ghcr.io/<owner>/readest-sync-server:<version> + :latest
#       selfhosted branch push (sync-server/**) → :edge

on:
  push:
    branches: ['selfhosted']
    paths: ['sync-server/**', '.github/workflows/docker-sync-server.yml']
    tags: ['v*']
  workflow_dispatch:

permissions: read-all

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/readest-sync-server

jobs:
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./sync-server
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ env.PLATFORM_PAIR }},mode=max
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: pick tags
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "TAGS=${IMAGE}:${GITHUB_REF_NAME#v},${IMAGE}:latest" >> "$GITHUB_ENV"
          else
            echo "TAGS=${IMAGE}:edge" >> "$GITHUB_ENV"
          fi

      - name: merge manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$TAGS") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: inspect
        run: docker buildx imagetools inspect "${IMAGE}:$( [[ "$GITHUB_REF_TYPE" == "tag" ]] && echo latest || echo edge )"
